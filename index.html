<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editorial Tour Poster Generator Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif !important;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #181818; }
    ::-webkit-scrollbar-thumb { background: #383838; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    input[type="range"] { accent-color: #ffffff; }
    .poster-canvas {
      width: 780px;
      min-height: 1100px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
      transition: background-color 0.15s ease;
    }
    .nav-tab.active {
      border-bottom: 2px solid #ffffff;
      color: #ffffff;
    }
    .cinema-card {
      transition: border-color 0.15s ease;
    }
    .cinema-card:hover {
      border-color: #555;
    }
  </style>
</head>
<body class="bg-[#111111] text-neutral-200 min-h-screen flex flex-col antialiased">

  <!-- Top Navigation Header -->
  <header class="w-full bg-[#181818] border-b border-neutral-800 px-5 py-2.5 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 bg-white"></div>
      <h1 class="text-xs font-bold tracking-wider text-white uppercase">Editorial Tour Poster Generator</h1>
      <span class="text-[11px] text-neutral-500 font-mono pl-2 border-l border-neutral-700">Typography Weights & Controls</span>
    </div>

    <!-- Quick Global Actions -->
    <div class="flex items-center gap-2">
      <div class="flex items-center bg-[#222] rounded px-2 py-1 border border-neutral-700 text-[11px] gap-1.5">
        <span class="text-neutral-400">Zoom:</span>
        <button onclick="setZoom(0.65)" class="px-1 text-neutral-400 hover:text-white">65%</button>
        <button onclick="setZoom(0.85)" class="px-1 text-neutral-400 hover:text-white">85%</button>
        <button onclick="setZoom(1.0)" class="px-1 text-white font-bold">100%</button>
      </div>

      <button onclick="rollClusterSeed()" class="bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-semibold px-2.5 py-1 rounded border border-neutral-600 flex items-center gap-1 transition">
        <span>🎲</span> Roll Seed
      </button>

      <button onclick="exportCleanVectorSVG()" class="bg-white hover:bg-neutral-200 text-black text-xs font-bold px-3 py-1 rounded transition flex items-center gap-1">
        <span>↓</span> SVG
      </button>

      <button onclick="exportPNG()" id="pngExportBtn" class="bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-bold px-3 py-1 rounded border border-neutral-700 transition">
        Eksportér PNG
      </button>
    </div>
  </header>

  <!-- Main Grid Workspace -->
  <div class="flex-1 flex flex-col lg:flex-row w-full overflow-y-auto">
    
    <!-- LEFT: Sidebar Navigation & Controls -->
    <aside class="w-full lg:w-[460px] bg-[#161616] border-r border-neutral-800 flex flex-col shrink-0 lg:max-h-[calc(100vh-45px)] overflow-y-auto">
      
      <!-- VISIBILITY BAR: SLÅ ADRESSE OG POSTNR TIL/FRA -->
      <div class="p-3 bg-[#1e1e1e] border-b border-neutral-700 flex items-center justify-between sticky top-0 z-30 shadow-md">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span class="text-[11px] font-bold text-white uppercase tracking-wider">Synlige elementer:</span>
        </div>
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-1.5 cursor-pointer text-xs select-none">
            <input type="checkbox" id="toggleShowPostcode" checked onchange="togglePostcodeVisibility(this.checked)" class="w-4 h-4 accent-white cursor-pointer">
            <span class="text-neutral-200 font-semibold hover:text-white">Postnr.</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer text-xs select-none">
            <input type="checkbox" id="toggleShowAddressMaster" checked onchange="toggleAddressVisibility(this.checked)" class="w-4 h-4 accent-white cursor-pointer">
            <span class="text-neutral-200 font-semibold hover:text-white">Adresse</span>
          </label>
        </div>
      </div>

      <!-- Sub-tabs for Settings -->
      <div class="flex border-b border-neutral-800 bg-[#141414] sticky top-[45px] z-20 text-[11px] font-medium">
        <button onclick="switchTab('data')" id="tabBtn-data" class="nav-tab
